<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALUMNY - Acervo de Eletrônica</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="icone.png" type="image/png">
</head>
<body>

<header>
  <h1>ALUMNY - Acervo de Eletrônica</h1>
  <p>Links de sites, documentos e jogos selecionados para apoiar os estudos do curso técnico de Eletrônica.</p>
</header>

<div class="controls">
  <input type="text" id="busca" placeholder="Buscar por assunto (ex: capacitor, Arduino, osciloscópio)...">
  <button class="filtro" data-cat="todos" aria-pressed="true">Todos</button>
  <button class="filtro" data-cat="sites" aria-pressed="false">Sites</button>
  <button class="filtro" data-cat="documentos" aria-pressed="false">Documentos</button>
  <button class="filtro" data-cat="jogos" aria-pressed="false">Jogos</button>
  <button id="temaEsc" class="filtro"
aria-pressed="false">🌙 Modo escuro</button></div>

<main id="conteudo"></main>

<footer>IFCE - Campus Canindé</footer>

<script src="javascript/script.js"></script>
</body>
</html>

@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
